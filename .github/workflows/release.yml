name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal DMG — users never have to know which chip they have.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned: the allowBuilds key in pnpm-workspace.yaml is pnpm 11 syntax.
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: pnpm install

      # An unset secret is not absent — GitHub sets the variable to an empty
      # string, Rust's var_os returns Some(""), and Tauri takes the
      # import-certificate branch anyway. It then fails ten minutes into the
      # build with "SecKeychainItemImport: One or more parameters ... were not
      # valid", which says nothing about the real cause. Check it up front.
      - name: Check signing secrets are present (macOS only)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD \
                      APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Signing secrets not set: ${missing[*]}"
            echo "Set them under Settings -> Secrets and variables -> Actions,"
            echo "or run scripts/set-signing-secrets.sh. See docs/RELEASE.md."
            exit 1
          fi
          echo "All seven signing secrets are present."

      - name: Write App Store Connect API key (macOS only)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "${{ github.workspace }}/apple-api-key.p8"
          chmod 600 "${{ github.workspace }}/apple-api-key.p8"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing (macOS only; ignored on other platforms)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Notarization via App Store Connect API key
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/apple-api-key.p8
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cignaler ${{ github.ref_name }}'
          releaseBody: |
            ## Install

            ```
            brew install --cask cignaler/tap/cignaler
            ```

            Or download `cignaler_VERSION_universal.dmg` below and drag it to
            Applications — one download works on both Apple silicon and Intel.
            The app is signed and notarized, so it opens on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Remove App Store Connect API key
        if: always() && startsWith(matrix.platform, 'macos')
        shell: bash
        run: rm -f "${{ github.workspace }}/apple-api-key.p8"
